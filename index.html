<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RUGO GAMES</title>
<style>body{font-family:Arial;background:#0b1020;color:#fff;max-width:520px;margin:40px auto;padding:20px}.box{background:#151e3b;padding:25px;border-radius:15px}input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px}button{background:#ffd54a;border:0;font-weight:bold}</style></head>
<body><div class="box"><h1>RUGO GAMES</h1><p>Player registration</p><input id="name" placeholder="Player name"><input id="email" type="email" placeholder="Email"><button onclick="register()">Register</button><p id="msg"></p></div>
<script>async function register(){const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),m=document.getElementById('msg');if(!name||!email){m.textContent='Fill in both fields.';return}const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email})});const d=await r.json();m.textContent=d.message||d.error}</script></body></html>
